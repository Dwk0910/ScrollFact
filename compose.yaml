name: scrollfact
services:
  scrollfact:
    build: .
    ports:
      - "127.0.0.1:${SCROLLFACT_PORT:-8080}:8080"
    volumes:
      - scrollfact-data:/app/data
      - scrollfact-secrets:/app/secrets
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  scrollfact-data:
  scrollfact-secrets:
