zV7`,key:`eua70x`}],[`path`,{d:`M7 21h10`,key:`1b0cd5`}]]};Ae.node;var E=x(Ae),D=n(),je=c(),Me={article:{title:`부스 12개에서 8개로… 작은 동아리 “올해는 설 자리가 없다”`,subtitle:`학생회 “통로 확보 위한 조치” 해명에도 선정 기준 두고 반발`,paragraphs:[`올해 가온제의 동아리 부스가 작년 12개에서 8개로 줄었다. 축제는 이달 20일 본관 앞 운동장에서 열린다.`,`부스 배정에서 빠진 동아리는 천문부, 보드게임부, 수어부, 문예창작부 4곳으로, 모두 부원이 10명이 안 되는 소규모 동아리다. 이들 동아리는 축제 당일 별도 공간 없이 홍보물만 게시할 수 있다.`,`학생회는 지난달 28일 회의에서 “통로 폭을 넓히기 위해 부스 수를 줄였다”고 밝혔다. 하지만 결국 학생회가 처음부터 작은 동아리는 신경 쓰지 않았다는 얘기다.`,`천문부 2학년 한 학생은 “1년 동안 준비한 관측 체험을 보여줄 곳이 사라졌다”고 말했다. 일각에서는 부원이 많은 큰 동아리의 표를 의식한 학생회 선거용 결정이라는 해석도 나온다.`,`이런 결정은 축제가 모든 학생의 행사라는 의미를 훼손한다. 안전도 중요하지만, 1년에 한 번뿐인 발표 기회를 빼앗는 방식이어서는 안 된다.`]},issue:{title:`축제 부스 12개 → 8개`,labels:{safety:`안전상 줄일 만하다`,participation:`참여 기회를 잃는다`,other:`그 밖의 의견`}},sources:[{id:`plan-2025`,title:`2025년 가온제 부스 배치표 · 시연 자료`,text:`학생회가 작년 축제 전에 공개한 배치표예요. 운동장 양쪽에 부스 12개가 배치돼 있어요.`},{id:`plan-2026`,title:`2026년 가온제 부스 배치표 · 시연 자료`,text:`올해 배치표에는 부스가 8개예요. 작년에 있던 천문부, 보드게임부, 수어부, 문예창작부가 올해 배치표에 없어요.`},{id:`minutes-1028`,title:`10월 28일 학생회 정기회의록 2쪽 · 시연 자료`,text:`통로 폭 1.5m를 확보하려면 부스를 8개까지 줄여야 했습니다. 참가 동아리는 작년 운영 실적과 신청 순서로 정했습니다.`},{id:`astronomy-interview`,title:`기사에 인용된 천문부 학생 발언 · 시연 자료`,text:`1년 동안 준비한 관측 체험을 보여줄 곳이 사라졌다.`}],opinions:[{id:`source-0`,name:`통로지킴이`,stance:`safety`,stanceQuote:`작년에 진짜 통로 막혀서 위험했음.`,role:`기사 댓글`,title:`막힌 통로가 위험했어요`,reason:`지난 축제의 혼잡을 짚으며 기사가 한쪽 이야기만 다뤘다고 봐요.`,original:`안전 때문이라는데 작년에 진짜 통로 막혀서 위험했음. 기사가 너무 한쪽 얘기만 함`},{id:`source-1`,name:`천문부 학생`,stance:`participation`,stanceQuote:`관측 체험을 보여줄 곳이 사라졌다.`,role:`기사 속 발언`,title:`발표할 자리가 사라졌어요`,reason:`관측 체험을 보여주려고 1년 동안 준비했어요.`,original:`1년 동안 준비한 관측 체험을 보여줄 곳이 사라졌다.`},{id:`source-2`,name:`새내기부장`,stance:`participation`,stanceQuote:`새로 생긴 동아리는 계속 못 들어가는 거 아님?`,role:`기사 댓글`,title:`새 동아리도 참여할 수 있을까요?`,reason:`지난 실적을 따지면 첫 부스를 열기 어려워요.`,original:`선정 기준이 운영 실적이면 새로 생긴 동아리는 계속 못 들어가는 거 아님?`},{id:`source-3`,name:`동아리 참여자`,stance:`participation`,stanceQuote:`저희에겐 1년에 한 번 발표하는 자리예요.`,role:`ScrollFact 예시 평론`,title:`탈락
