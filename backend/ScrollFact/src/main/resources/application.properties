spring.datasource.url=${SCROLLFACT_DB_URL:jdbc:sqlite:./scrollfact.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.address=${SCROLLFACT_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true
scrollfact.evaluator.url=${SCROLLFACT_EVALUATOR_URL:}
scrollfact.evaluator.token=${SCROLLFACT_EVALUATOR_TOKEN:}
scrollfact.cors.origins=${SCROLLFACT_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,chrome-extension://*}
