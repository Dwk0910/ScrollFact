worker_processes 1;
pid /tmp/scrollfact-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/scrollfact-client;
    proxy_temp_path /tmp/scrollfact-proxy;
    fastcgi_temp_path /tmp/scrollfact-fastcgi;
    uwsgi_temp_path /tmp/scrollfact-uwsgi;
    scgi_temp_path /tmp/scrollfact-scgi;
    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 6m;
        location /v1/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_read_timeout 240s;
        }
        location / {
            root /app/public;
            index index.html;
            add_header Cache-Control "no-store";
            try_files $uri $uri/ =404;
        }
    }
}
